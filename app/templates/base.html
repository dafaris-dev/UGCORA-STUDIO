<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}UGCORA Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    try {
      var t = localStorage.getItem('ugcora_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch(_) {}
  </script>
</head>
<body class="theme-dark">
  {% if request.session.get('user') %}
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">U</div>
      <div class="brand-text">
        <div class="brand-name">UGCORA</div>
        <div class="brand-sub">AI UGC Studio</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link{% if request.url.path == '/' %} active{% endif %}">Dashboard</a>
      <a href="/create" class="nav-link accent">+ Create Video</a>
      <a href="/project" class="nav-link{% if request.url.path.startswith('/project') %} active{% endif %}">Project</a>
      <a href="/biaya" class="nav-link{% if request.url.path == '/biaya' %} active{% endif %}">Biaya</a>
      <a href="/settings" class="nav-link{% if request.url.path == '/settings' %} active{% endif %}">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user">{{ request.session.get('user') }}</div>
      <a href="/logout" class="logout">Log out</a>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  {% else %}
    {% block auth_content %}{% endblock %}
  {% endif %}

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
