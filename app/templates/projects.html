{% extends "base.html" %}
{% block title %}Projects — UGCORA Studio{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Projects</h1>
  <button class="btn btn-primary" onclick="document.getElementById('new-project').showModal()">+ New Project</button>
</header>

<div class="grid grid-3">
  {% for p in projects %}
  <a href="/projects/{{ p.id }}" class="card hover">
    <h3>{{ p.name }}</h3>
    <p class="muted small">{{ p.description[:140] }}</p>
    <p class="small">Updated {{ p.updated_at.strftime('%Y-%m-%d') }}</p>
  </a>
  {% else %}
  <div class="card empty">No projects yet.</div>
  {% endfor %}
</div>

<dialog id="new-project" class="modal">
  <form class="form" action="/api/projects" method="post" onsubmit="return submitForm(event, this, '/projects')">
    <h2>New Project</h2>
    <label>Name</label><input name="name" required />
    <label>Description</label><textarea name="description" rows="2"></textarea>
    <div class="actions">
      <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">Cancel</button>
      <button class="btn btn-primary" type="submit">Create</button>
    </div>
  </form>
</dialog>
{% endblock %}
