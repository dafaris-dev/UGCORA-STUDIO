{% extends "base.html" %}
{% block title %}Enter Studio — UGCORA{% endblock %}
{% block auth_content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark large">U</div>
      <h1>UGCORA</h1>
      <p class="muted">AI UGC Creative Studio</p>
    </div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus />
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit">Enter Studio</button>
    </form>
    <p class="muted small">Private workspace — single owner only.</p>
  </div>
</div>
{% endblock %}
